name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vsce package -o vscode-nbt-plus.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-nbt-plus.vsix
