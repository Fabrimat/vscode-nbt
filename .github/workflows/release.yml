name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vsce package -o vscode-nbt-plus.vsix
      - run: npx vsce publish --packagePath vscode-nbt-plus.vsix -p ${{ secrets.VSCE_PAT }}
      - run: npx ovsx publish vscode-nbt-plus.vsix -p ${{ secrets.OVSX_PAT }}
      - uses: softprops/action-gh-release@v2
        with:
          files: vscode-nbt-plus.vsix
