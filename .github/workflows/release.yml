name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vsce package -o vscode-nbt-plus.vsix
      - if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath vscode-nbt-plus.vsix -p "$VSCE_PAT"
      - if: env.OVSX_PAT != ''
        run: npx ovsx publish vscode-nbt-plus.vsix -p "$OVSX_PAT"
      - uses: softprops/action-gh-release@v2
        with:
          files: vscode-nbt-plus.vsix
